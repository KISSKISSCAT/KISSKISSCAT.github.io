baseURL = "https://kisskisscat.github.io/"
locale = "zh-CN"
title = "KISSKISSCAT"
theme = "cyber-hugo"
enableRobotsTXT = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

[params]
  mainColor = "cyan"
  accentColor = "fuchsia"

  [params.site]
    name = "KISSKISSCAT"
    description = "IRC server operator (InspIRCd / Anope)"

  [params.author]
    name = "KISSKISSCAT"
    expertise = "IRC Server Operator (InspIRCd / Anope)"
    bio = "IRC 服务器运维人员，专注 InspIRCd 与 Anope 方向。"

  [params.homepage]
    show_console_widget = false
    [params.homepage.widgets]
      order = ["about_me"]
      [params.homepage.widgets.about_me]
        title = "ABOUT_ME"
        show_avatar = false
        show_scanning_overlay = false

[menus]
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 1
